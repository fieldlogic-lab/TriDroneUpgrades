name: Build TriDrone Android APK
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK platform
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Restore persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TRIDRONE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tridrone.jks"
            echo "TRIDRONE_KEYSTORE_PATH=$RUNNER_TEMP/tridrone.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Persistent signing is not configured; in-place updates may fail."
          fi
      - name: Compile debug APK
        env:
          TRIDRONE_STORE_PASSWORD: ${{ secrets.TRIDRONE_STORE_PASSWORD }}
          TRIDRONE_KEY_ALIAS: ${{ secrets.TRIDRONE_KEY_ALIAS }}
          TRIDRONE_KEY_PASSWORD: ${{ secrets.TRIDRONE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TriDrone-Logger-v0.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish signed update to this repository
        if: ${{ env.TRIDRONE_KEYSTORE_PATH != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          VERSION=$((1000 + GITHUB_RUN_NUMBER))
          cp "$APK" "$RUNNER_TEMP/tridrone.apk"
          jq -nc --argjson versionCode "$VERSION" --arg apkUrl "https://github.com/$GITHUB_REPOSITORY/releases/download/dev-latest/tridrone.apk" --arg sha256 "$SHA" '{versionCode:$versionCode,apkUrl:$apkUrl,sha256:$sha256}' > "$RUNNER_TEMP/latest.json"
          if ! gh release view dev-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create dev-latest -R "$GITHUB_REPOSITORY" --title "TriDrone development updates" --notes "Development builds; install with Android approval." --latest
          fi
          gh release upload dev-latest "$RUNNER_TEMP/tridrone.apk#tridrone.apk" "$RUNNER_TEMP/latest.json#latest.json" -R "$GITHUB_REPOSITORY" --clobber
          echo "Update feed: https://github.com/$GITHUB_REPOSITORY/releases/download/dev-latest/latest.json"
      - name: Report missing signing configuration
        if: ${{ env.TRIDRONE_KEYSTORE_PATH == '' }}
        run: echo "::warning::Set TRIDRONE_KEYSTORE_BASE64 and signing secrets to enable automatic release publishing."
