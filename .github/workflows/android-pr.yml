name: Validate Android pull requests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Android PR validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test AI team orchestration safeguards
        run: python3 -m unittest discover -s scripts/ai-team -p test_runner.py -v
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK platform
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Test, lint, and compile debug APK
        run: gradle --no-daemon --continue :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TriDrone-pr-${{ github.event.pull_request.number }}-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
