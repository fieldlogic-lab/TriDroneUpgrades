name: Validate Android pull requests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Android PR validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK platform
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Test, lint, and compile debug APK
        run: gradle --no-daemon --continue :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TriDrone-pr-${{ github.event.pull_request.number }}-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
      - name: Record QA APK provenance
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          mkdir -p qa-apk
          cp app/build/outputs/apk/debug/app-debug.apk qa-apk/TriDrone-qa-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging qa-apk/TriDrone-qa-debug.apk > qa-apk/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs qa-apk/TriDrone-qa-debug.apk > qa-apk/signing-certificate.txt
          sha256sum qa-apk/TriDrone-qa-debug.apk > qa-apk/SHA256SUMS.txt
          printf 'commit_sha=%s\nrun_id=%s\nrun_attempt=%s\nsigning=ephemeral Android debug key; not a production release\n' "$EXPECTED_HEAD_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > qa-apk/build-info.txt
          cat qa-apk/build-info.txt qa-apk/SHA256SUMS.txt
          head -n 1 qa-apk/apk-badging.txt
      - name: Upload installable QA debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TriDrone-pr-${{ github.event.pull_request.number }}-qa-apk
          path: qa-apk/
          if-no-files-found: error
          retention-days: 14
